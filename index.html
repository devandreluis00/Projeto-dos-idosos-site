<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat da Turma</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <main class="login-screen">
    <section class="login-card">
      <div class="login-logo">💬</div>
      <h1>Chat da Turma</h1>
      <p>Digite seu nome para entrar na conversa.</p>

      <form id="form-entrada">
        <input id="campo-nome" type="text" placeholder="Seu nome"
               autocomplete="off" maxlength="40" required />
        <button id="botao-entrar" type="submit">Entrar no chat</button>
      </form>

      <p id="mensagem-erro" class="login-error" role="alert"></p>
    </section>
  </main>

  <script type="module">
    import { entrarNoChat } from "./js/auth.js";

    const form = document.getElementById("form-entrada");
    const campoNome = document.getElementById("campo-nome");
    const botaoEntrar = document.getElementById("botao-entrar");
    const mensagemErro = document.getElementById("mensagem-erro");

    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      mensagemErro.textContent = "";
      botaoEntrar.disabled = true;
      botaoEntrar.textContent = "Entrando...";

      try {
        await entrarNoChat(campoNome.value);
        window.location.href = "app.html";
      } catch (erro) {
        console.error(erro);
        mensagemErro.textContent =
          "Não foi possível entrar. Verifique a conexão e o Firebase.";
        botaoEntrar.disabled = false;
        botaoEntrar.textContent = "Entrar no chat";
      }
    });
  </script>
</body>
</html>
