<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat da Turma</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="tela-principal">
    <header class="topo">
      <h1>CHAT DA TURMA</h1>
      <button id="botao-sair" class="botao-sair" type="button">SAIR</button>
    </header>

    <div class="conteudo">
      <aside class="painel-participantes">
        <h2>Quem está na turma?</h2>
        <div id="lista-participantes" class="lista-participantes"></div>
      </aside>

      <section class="painel-chat">
        <p id="aviso-selecione" class="aviso-selecione">
          Escolha uma pessoa na lista ao lado para conversar.
        </p>

        <div id="area-chat" class="area-chat" style="display: none">
          <h2 id="titulo-conversa">Conversando com...</h2>
          <div id="indicador-digitando" class="indicador-digitando" aria-live="polite" hidden>
            <span class="ponto-digitando"></span>
            <span class="ponto-digitando"></span>
            <span class="ponto-digitando"></span>
            <span id="texto-digitando">Está digitando...</span>
          </div>
          <div id="mensagens" class="mensagens"></div>

          <form id="form-envio" class="form-envio">
            <input
              type="text"
              id="campo-mensagem"
              placeholder="Digite sua mensagem..."
              autocomplete="off"
              maxlength="500"
              required
            />
            <button type="submit">ENVIAR</button>
          </form>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
