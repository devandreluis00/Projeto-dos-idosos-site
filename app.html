<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat da Turma</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="whatsapp-app">
    <aside class="sidebar">
      <header class="sidebar-header">
        <h1>Conversas</h1>
        <div class="header-actions">
          <button id="botao-nova-conversa" type="button" title="Nova conversa">＋</button>
          <button id="botao-menu" type="button" title="Menu">⋮</button>
        </div>
      </header>

      <div class="search-wrap">
        <span>⌕</span>
        <input id="pesquisa-participantes"
               type="search"
               placeholder="Pesquisar ou começar uma nova conversa"
               autocomplete="off" />
      </div>

      <div class="chat-filters">
        <button type="button" class="filter active">Tudo</button>
        <button type="button" class="filter">Não lidas</button>
        <button type="button" class="filter">Favoritas</button>
      </div>

      <div id="lista-participantes" class="conversation-list"></div>

      <footer class="sidebar-user">
        <span id="avatar-me" class="avatar">EU</span>
        <div>
          <strong id="nome-me">Você</strong>
          <small>Conectado</small>
        </div>
        <button id="botao-sair" type="button" title="Sair">↪</button>
      </footer>
    </aside>

    <section class="chat-panel">
      <div id="aviso-selecione" class="empty-chat">
        <div class="empty-chat-icon">💬</div>
        <h2>Chat da Turma</h2>
        <p>Selecione uma conversa para começar.</p>
      </div>

      <div id="area-chat" class="chat-area" style="display:none">
        <header class="chat-header">
          <div class="chat-contact">
            <span id="avatar-contato" class="avatar avatar-large">?</span>
            <div>
              <strong id="titulo-conversa">Conversando com...</strong>
              <small id="status-contato" class="contact-status">offline</small>
            </div>
          </div>
          <div class="chat-actions">
            <button type="button" title="Pesquisar">⌕</button>
            <button type="button" title="Mais opções">⋮</button>
          </div>
        </header>

        <div id="status-conversa" class="conversation-status-banner" hidden></div>
        <div id="indicador-digitando" class="typing-indicator" hidden>
          <span id="texto-digitando"></span>
        </div>

        <div id="mensagens" class="messages"></div>

        <form id="form-envio" class="message-form">
          <button type="button" class="composer-button" title="Emoji">☺</button>
          <button type="button" class="composer-button" title="Anexar">＋</button>
          <input id="campo-mensagem" type="text"
                 placeholder="Digite uma mensagem"
                 autocomplete="off" maxlength="500" />
          <button type="submit" class="send-button" title="Enviar">➤</button>
        </form>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
